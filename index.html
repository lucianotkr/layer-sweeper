<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="Dig deeper in a 60-second layered Minesweeper rush. Play LAYER SWEEPER and share your score!">
  <meta name="author" content="Lucy_jackso">
  <meta property="og:type" content="website">
  <meta property="og:title" content="LAYER SWEEPER">
  <meta property="og:description" content="A 60-second layered Minesweeper rush by Lucy_jackso. How deep can you dig?">
  <meta property="og:url" content="https://lucianotkr.github.io/layer-sweeper/">
  <meta name="twitter:card" content="summary">
  <title>LAYER SWEEPER</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; color: #f7f1de; }
    body { font-family: system-ui, sans-serif; overscroll-behavior: none; }
    #player { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: grid; place-items: center; }
    #stage { position: relative; width: min(100%, 56.25vh); height: 100%; }
    @supports (height: 100dvh) { #stage { width: min(100%, 56.25dvh); } }
    @media (max-width: 600px) { #stage { width: 100%; } }
    #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; -webkit-user-select: none; user-select: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #101820; padding: 28px; text-align: center; }
    #loading strong { letter-spacing: .12em; }
    progress { width: min(280px, 85%); height: 8px; accent-color: #ffb547; }
    #status { color: #91a5ab; font-size: 14px; line-height: 1.6; }
    #loading.failed #status { color: #f45b69; }
    [hidden] { display: none !important; }
    [data-result-share]:focus-visible { outline: 2px solid #ffb547; outline-offset: 2px; border-radius: 8px; }
  </style>
</head>
<body>
  <main id="player"><div id="stage">
    <canvas id="unity-canvas" width="1080" height="1920" tabindex="0" aria-label="LAYER SWEEPER"></canvas>
    <div id="loading" role="status" aria-live="polite">
      <strong>LAYER SWEEPER</strong>
      <progress id="progress" value="0" max="1"></progress>
      <span id="status">Loading…</span>
    </div>
  </div></main>
  <script src="sharing.js"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const japanese = navigator.language.toLowerCase().startsWith('ja');
    document.documentElement.lang = japanese ? 'ja' : 'en';
    status.textContent = japanese ? '読み込み中…' : 'Loading…';
    function fail(message) {
      loading.hidden = false;
      loading.classList.add('failed');
      progress.hidden = true;
      status.textContent = japanese ? '読み込みに失敗しました。ページを再読み込みしてください。' : 'Could not load the game. Please reload the page.';
      console.error(message);
    }
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    const config = {
      arguments: [],
      dataUrl: 'Build/4151164d9875a6dea5949ff4af16c94f.data.unityweb',
      frameworkUrl: 'Build/05980831e2dc26a6ddb8d18cf07e03cf.framework.js.unityweb',
      codeUrl: 'Build/590bcd62a8cb70b7d8740d7a1283867a.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "LAYER SWEEPER",
      productVersion: "0.1.0",
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: (message, type) => type === 'error' ? fail(message) : console.warn(message)
    };
    const loader = document.createElement('script');
    loader.src = 'Build/d5fc56fa01a0220ee13a13d37d65e96c.loader.js';
    loader.onerror = () => fail('Unity loader request failed');
    loader.onload = () => createUnityInstance(canvas, config, value => {
      progress.value = value;
      status.textContent = `${japanese ? '読み込み中' : 'Loading'} ${Math.round(value * 100)}%`;
    }).then(() => {
      loading.hidden = true;
      canvas.dataset.ready = 'true';
      canvas.focus();
    }).catch(fail);
    document.body.appendChild(loader);
  </script>
</body>
</html>
